<!DOCTYPE html>
<html>
  <head>
    <title>ChatGPT - XP Edition</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script src="/lib/showdown.min.js" type="text/javascript"></script>
    <style>
      body {
        background-color: #008080;
        font-family: Tahoma, sans-serif;
        color: black;
        text-align: center;
        margin: 0;
      }
      .window {
        width: 400px;
        background: #ece9d8;
        border: 2px solid #808080;
        padding: 4px;
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: -200px;
        margin-left: -200px;
      }
      .title-bar {
        background: #000080;
        color: white;
        font-weight: bold;
        padding: 4px;
        text-align: left;
      }
      .login-box,
      .chat-controls {
        background: white;
        padding: 6px;
        border: 1px solid black;
        margin-bottom: 4px;
      }
      .chat-box {
        border: 1px solid black;
        background: white;
        height: 200px;
        overflow-y: auto;
        padding: 4px;
        text-align: left;
        font-size: 12px;
        line-height: 1.5;
        display: none;
      }
      .button {
        background: #c0c0c0;
        border: 1px solid #808080;
        padding: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .button:hover {
        background: #a0a0a0;
      }
      .error {
        color: red;
        font-weight: bold;
        margin-top: 4px;
      }
    </style>
    <script>
      function httpRequest(method, url, data, callback) {
        var xhr;
        if (window.XMLHttpRequest) {
          xhr = new XMLHttpRequest();
        } else {
          xhr = new ActiveXObject("Microsoft.XMLHTTP");
        }
        xhr.open(method, url, true);
        xhr.setRequestHeader(
          "Content-Type",
          "application/x-www-form-urlencoded"
        );
        xhr.onreadystatechange = function () {
          if (xhr.readyState == 4) {
            callback(xhr.status, xhr.responseText);
          }
        };
        xhr.send(data);
      }

      function getToken() {
        return document.cookie.replace(
          /(?:(?:^|.*;)\s*token\s*=\s*([^;]*).*$)|^.*$/,
          "$1"
        );
      }

      function login() {
        var passwordField = document.getElementById("login-password");
        var errorBox = document.getElementById("errorBox");
        var loginButton = document.getElementById("login-button");
        errorBox.innerHTML = "";
        passwordField.disabled = true;
        loginButton.disabled = true;
        httpRequest(
          "POST",
          "/login",
          "password=" + encodeURIComponent(passwordField.value),
          function (status, response) {
            passwordField.disabled = false;
            loginButton.disabled = false;
            if (status == 200) {
              var data = eval("(" + response + ")");
              document.cookie =
                "token=" + encodeURIComponent(data.token) + "; path=/";
              location.reload();
            } else {
              errorBox.innerHTML = "Login failed: " + response;
              passwordField.value = "";
            }
          }
        );
      }

      function sendMessage() {
        var messageField = document.getElementById("chat-input");
        var chatBox = document.getElementById("chatBox");
        var errorBox = document.getElementById("errorBox");
        var token = getToken();
        if (!messageField.value) return;
        messageField.disabled = true;
        httpRequest(
          "POST",
          "/chat",
          "message=" +
            encodeURIComponent(messageField.value) +
            "&token=" +
            encodeURIComponent(token),
          function (status, response) {
            messageField.disabled = false;
            if (status == 200) {
              var data = eval("(" + response + ")");
              var converter = new showdown.Converter();
              var formattedMessage = converter.makeHtml(data.reply);
              chatBox.innerHTML +=
                "<p><b>You:</b> " + messageField.value + "</p>";
              chatBox.innerHTML +=
                "<p><b>Bot:</b> " + formattedMessage + "</p>";
              chatBox.scrollTop = chatBox.scrollHeight;
              messageField.value = "";
            } else {
              errorBox.innerHTML = "Error: " + response;
            }
          }
        );
      }

      function logout() {
        httpRequest(
          "POST",
          "/logout",
          "token=" + encodeURIComponent(getToken()),
          function () {
            document.cookie =
              "token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
            location.reload();
          }
        );
      }

      function checkLoginStatus() {
        var token = getToken();
        if (token) {
          document.getElementById("login-box").style.display = "none";
          document.getElementById("chatBox").style.display = "block";
          document.getElementById("chat-controls").style.display = "block";
          document.getElementById("logout-btn").style.display = "block";
        }
      }

      function addEvent(element, event, handler) {
        if (element.attachEvent) {
          element.attachEvent("on" + event, handler);
        } else {
          element.addEventListener(event, handler, false);
        }
      }

      addEvent(window, "load", function () {
        checkLoginStatus();
        var chatInput = document.getElementById("chat-input");
        addEvent(chatInput, "keypress", function (event) {
          if (event.keyCode === 13) {
            sendMessage();
            event.returnValue = false;
          }
        });
      });
    </script>
  </head>
  <body>
    <div class="window">
      <div class="title-bar">WindXPT - Window XP Talk</div>
      <div id="login-box" class="login-box">
        <p><b>Login</b></p>
        <input type="password" id="login-password" placeholder="Password" />
        <button id="login-button" onclick="login()" class="button">
          Login
        </button>
      </div>
      <div id="chatBox" class="chat-box"></div>
      <div id="chat-controls" class="chat-controls" style="display: none">
        <input type="text" id="chat-input" placeholder="Type your message..." />
        <button onclick="sendMessage()" class="button">Send</button>
      </div>
      <button
        onclick="logout()"
        class="button"
        id="logout-btn"
        style="display: none"
      >
        Logout
      </button>
      <div id="errorBox" class="error"></div>
    </div>
  </body>
</html>
